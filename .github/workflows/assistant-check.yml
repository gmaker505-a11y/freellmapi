name: FreeLLMAPI assistant build and diagnostics

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: freellmapi-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Install, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up supported Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build

      - name: Upload diagnostic summary
        if: always()
        shell: bash
        run: |
          {
            echo "# FreeLLMAPI verification"
            echo
            echo "- Commit: `$GITHUB_SHA`"
            echo "- Event: `$GITHUB_EVENT_NAME`"
            echo "- Node: $(node --version 2>&1)"
            echo "- npm: $(npm --version 2>&1)"
            echo
            echo "Full step output is available in this GitHub Actions run."
          } > verification-summary.md

      - name: Save diagnostic summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freellmapi-verification-summary
          path: verification-summary.md
          if-no-files-found: warn
          retention-days: 7
